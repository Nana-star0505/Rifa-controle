<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Rifa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #17212b;
      --paper: #f7f3ea;
      --coral: #f05d4e;
      --leaf: #246b58;
      --sun: #f6c85f;
      --line: #d9d1c3;
      --white: #fffdf8;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      margin: 0;
      background-color: var(--paper);
      padding: 2rem;
    }

    .display-font { font-family: "Fraunces", serif; }

    header { margin-bottom: 2rem; }
    
    .badge {
      color: var(--coral);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0.3rem 0;
    }

    p.subtitle {
      color: #655d54;
      margin: 0;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card-panel {
      background: var(--white);
      padding: 1.5rem;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 20px rgba(23, 33, 43, 0.04);
    }

    .form-group { margin-bottom: 1rem; }
    
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-group input[type="number"],
    .form-group input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #faf7f2;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--leaf);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.2rem 0;
      background: #faf7f2;
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--leaf);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--leaf);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      filter: brightness(0.95);
    }

    .raffle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.8rem;
    }

    .raffle-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.8rem 0.6rem;
      text-align: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 72px;
    }

    .raffle-card.reserved {
      background: var(--sun);
      border-color: transparent;
      color: var(--ink);
    }

    .raffle-card.paid {
      background: var(--leaf) !important;
      border-color: transparent;
      color: #ffffff !important;
    }

    .raffle-card .num {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
    }

    .raffle-card .status-tag {
      font-size: 0.7rem;
      margin-top: 4px;
      font-weight: 500;
      opacity: 0.9;
    }

    #form-status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.8rem;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">● Rifa em andamento</span>
    <h1 class="display-font">Controle de Rifa</h1>
    <p class="subtitle">Registre as vendas e acompanhe os carnês e cotas em tempo real.</p>
  </header>

  <div class="layout">
    <!-- Formulário -->
    <div class="card-panel">
      <h3 class="display-font" style="margin-top:0; font-size:1.3rem;">Registrar Venda</h3>
      <p style="font-size: 0.8rem; color: #655d54; margin-bottom: 1.2rem;">Escolha o número do carnê e a cota.</p>

      <form id="sale-form">
        <div class="form-group">
          <label for="raffle-number">Número do Carnê (1 a 100)</label>
          <input type="number" id="raffle-number" min="1" max="100" placeholder="Ex: 12" required>
        </div>

        <div class="form-group">
          <label for="sub-number">Cota / Subnúmero (1 a 10)</label>
          <input type="number" id="sub-number" min="1" max="10" value="1" required>
        </div>

        <div class="form-group">
          <label for="buyer-name">Nome do Comprador</label>
          <input type="text" id="buyer-name" placeholder="Digite o nome..." required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="payment-check">
          <label for="payment-check">Pagamento Confirmado (PAGO)</label>
        </div>

        <button type="submit" id="save-button" class="btn-submit">Registrar Venda</button>
      </form>

      <div id="form-status"></div>
    </div>

    <!-- Mapa de Números -->
    <div>
      <h3 class="display-font" style="margin-top:0; font-size:1.3rem; margin-bottom: 1rem;">Mapa Completo dos Carnês</h3>
      <div id="raffle-grid" class="raffle-grid"></div>
    </div>
  </div>

  <script>
    const TOTAL_CARNES = 100;
    const SUB_PER_CARNE = 10;
    let records = [];

    const grid = document.getElementById("raffle-grid");
    const saleForm = document.getElementById("sale-form");
    const numberInput = document.getElementById("raffle-number");
    const subInput = document.getElementById("sub-number");
    const buyerInput = document.getElementById("buyer-name");
    const paymentCheck = document.getElementById("payment-check");
    const formStatus = document.getElementById("form-status");

    function setStatus(msg, isError) {
      formStatus.textContent = msg;
      formStatus.style.color = isError ? "#f05d4e" : "#246b58";
    }

    function recordForSubNumber(carneNum, subNum) {
      return records.find(r => r.sub_code === `${carneNum}.${subNum}`);
    }

    function getCarneStatus(carneNum) {
      let paidCount = 0;
      let reservedCount = 0;

      for (let i = 1; i <= SUB_PER_CARNE; i++) {
        const rec = recordForSubNumber(carneNum, i);
        if (rec) {
          if (rec.payment_status === "paid") paidCount++;
          else reservedCount++;
        }
      }

      if (paidCount === SUB_PER_CARNE) return "paid";
      if (paidCount > 0 || reservedCount > 0) return "reserved";
      return "available";
    }

    function syncGrid() {
      grid.innerHTML = "";
      for (let i = 1; i <= TOTAL_CARNES; i++) {
        const card = document.createElement("div");
        const status = getCarneStatus(i);
        card.className = `raffle-card ${status}`;

        let statusText = "Disponível";
        if (status === "paid") statusText = "Carnê Pago";
        else if (status === "reserved") statusText = "Em Andamento";

        card.innerHTML = `
          <div class="num display-font">${String(i).padStart(2, "0")}</div>
          <div class="status-tag">${statusText}</div>
        `;
        grid.appendChild(card);
      }
    }

    saleForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const carneNum = Number(numberInput.value);
      const subNum = Number(subInput.value);
      const buyerName = buyerInput.value.trim();
      const isPaid = paymentCheck.checked;
      const subCode = `${carneNum}.${subNum}`;

      if (records.find(r => r.sub_code === subCode)) {
        setStatus(`Cota ${subCode} já foi registrada.`, true);
        return;
      }

      setStatus("Salvando venda…", false);

      const newRecord = {
        carne_number: carneNum,
        sub_number: subNum,
        sub_code: subCode,
        buyer_name: buyerName,
        payment_status: isPaid ? "paid" : "pending",
        created_at: new Date().toISOString()
      };

      if (window.dataSdk) {
        const result = await window.dataSdk.create(newRecord);
        if (result.isOk) {
          saleForm.reset();
          setStatus(`Cota ${subCode} registrada com sucesso!`, false);
        } else {
          setStatus("Erro ao salvar a venda.", true);
        }
      } else {
        records.push(newRecord);
        saleForm.reset();
        syncGrid();
        setStatus(`Cota ${subCode} registrada!`, false);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      syncGrid();
      if (window.dataSdk) {
        window.dataSdk.init({
          onDataChanged(data) {
            records = data;
            syncGrid();
          }
        });
      }
    });
  </script>
</body>
</html>
